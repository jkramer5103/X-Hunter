<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passwort festlegen - Mr. X Spiel</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-body">

    <div class="login-container">
        <h1>Willkommen, {{ username }}!</h1>
        <p style="text-align: center; margin-bottom: 20px; color: #666;">
            Dies ist Ihr erster Login.<br>
            Bitte legen Sie Ihr Passwort fest.
        </p>

        <!-- Flash Nachrichten anzeigen -->
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            <ul class=flash-messages>
            {% for category, message in messages %}
              <li class="flash-{{ category }}">{{ message }}</li>
            {% endfor %}
            </ul>
          {% endif %}
        {% endwith %}

        <form method="post">
            <div>
                <label for="password">Passwort:</label>
                <input type="password" id="password" name="password" required 
                       placeholder="Mindestens 6 Zeichen" minlength="6" autofocus>
            </div>
            <div>
                <label for="password_confirm">Passwort bestätigen:</label>
                <input type="password" id="password_confirm" name="password_confirm" required 
                       placeholder="Passwort wiederholen">
            </div>
            <button type="submit">Passwort festlegen und einloggen</button>
        </form>
        
        <div style="text-align: center; margin-top: 20px;">
            <a href="{{ url_for('login') }}">Anderer Benutzer</a>
        </div>
    </div>

</body>
</html>
